name: CI Pipeline

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  # Frontend Tests and Build
  web-test:
    name: Web App Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json

    - name: Install dependencies
      working-directory: apps/web
      run: npm ci

    - name: Run linting
      working-directory: apps/web
      run: npm run lint

    - name: Build application
      working-directory: apps/web
      run: npm run build

    - name: Run Lighthouse CI (Performance)
      working-directory: apps/web
      run: |
        npm install -g @lhci/cli
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Backend Tests
  api-test:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: services/api/requirements.txt

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-kor libopencv-dev

    - name: Install Python dependencies
      working-directory: services/api
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Run API tests
      working-directory: services/api
      run: pytest -v
      env:
        DATABASE_URL: sqlite:///./test.db
        OPENAI_API_KEY: mock_key_for_testing

    - name: Check API health
      working-directory: services/api
      run: |
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://localhost:8000/health || exit 1

  # E2E Tests
  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [web-test, api-test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd apps/web && npm ci
        cd services/api && pip install -r requirements.txt

    - name: Install Playwright
      working-directory: apps/web
      run: npx playwright install --with-deps

    - name: Start services
      run: |
        docker-compose up -d --build
        sleep 30

    - name: Wait for services
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:3000/creator/home; do sleep 2; done'
        timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

    - name: Run E2E tests
      working-directory: apps/web
      run: npm run test:e2e

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: apps/web/playwright-report/
        retention-days: 30

    - name: Stop services
      if: always()
      run: docker-compose down

  # Security and Quality Checks
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [web-test, api-test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build web image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/web
        push: false
        tags: jjikmeok-web:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build API image
      uses: docker/build-push-action@v5
      with:
        context: ./services/api
        push: false
        tags: jjikmeok-api:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker Compose
      run: |
        docker-compose config
        docker-compose up -d --build
        sleep 30
        docker-compose ps
        curl -f http://localhost:3000 || exit 1
        curl -f http://localhost:8000/health || exit 1
        docker-compose down

  # Code Quality
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: CodeClimate Test Coverage
      uses: paambaati/codeclimate-action@v5.0.0
      env:
        CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
      with:
        coverageCommand: echo "Coverage placeholder"
        debug: true